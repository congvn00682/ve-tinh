[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "satdomain"
version = "0.1.0"
description = "Cross-domain satellite/aerial scene classification experiments"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "Pillow>=10.2",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "torch>=2.3",
  "torchvision>=0.18",
  "timm>=1.0",
]

[project.scripts]
satdomain-train = "satdomain.train:main"
satdomain-evaluate = "satdomain.evaluate:main"
satdomain-infer = "satdomain.infer:main"

[tool.setuptools.packages.find]
where = ["src"]

